services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: developer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      interval: 1s

  # The release image, run by `just docker`.
  app:
    profiles: [docker]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "3010:3000"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgresql://postgres:developer@postgres:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
